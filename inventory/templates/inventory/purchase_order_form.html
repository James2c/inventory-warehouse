{% extends "inventory/base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}

<div class="mb-4">

    <h1 class="mb-1">
        {{ title }}
    </h1>

    <p class="text-muted mb-0">
        Create a purchase order for a supplier.
    </p>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}


            {% for field in form %}

                <div class="mb-3">

                    <label
                        for="{{ field.id_for_label }}"
                        class="form-label"
                    >
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}

                        <div class="text-danger small mt-1">
                            {{ field.errors }}
                        </div>

                    {% endif %}

                </div>

            {% endfor %}


            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    {{ submit_label }}
                </button>

                <a
                    href="{% url 'purchase_order_list' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
